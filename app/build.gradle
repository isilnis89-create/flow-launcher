plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nick.flowlauncher'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nick.flowlauncher'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
